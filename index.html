<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>MSH Academy Registration</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    padding: 20px;
}

.container {
    background: white;
    max-width: 850px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.header {
    text-align: center;
    border-bottom: 2px solid #ddd;
}

.header img {
    width: 90px;
}

.header h2 {
    margin: 10px 0;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.photo-preview {
    width: 120px;
    height: 140px;
    border: 2px dashed #aaa;
    margin: 10px auto;
    object-fit: cover;
}

.signature {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.signature div {
    text-align: center;
    width: 30%;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #0f2027;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<div id="formArea" class="container">

<div class="header">
    <img src="https://raw.githubusercontent.com/imranmahi529/Marhum-Sazzad-Hossain-Memorial-Football-Academy/refs/heads/main/file_0000000036d0720695474bda0a2cebbb.png">
    <h2>মরহুম সাজ্জাদ হোসাইন স্মৃতি ফুটবল একাডেমি</h2>
</div>

<input type="date">

<!-- Photo Upload -->
<input type="file" accept="image/*" onchange="loadPhoto(event)">
<img id="photo" class="photo-preview">

<div class="grid">
<input placeholder="নাম">
<input type="date">
<input placeholder="গ্রাম">
<input placeholder="শিক্ষাগত যোগ্যতা">
<input placeholder="থানা ও জেলা">
<input placeholder="পরিচয়পত্র নং">
<input placeholder="মোবাইল নাম্বার">
<input placeholder="ইমেইল">
<input placeholder="রক্তের গ্রুপ">
</div>

<h3>অঙ্গীকারনামা</h3>

<textarea rows="8">
আমি এই মর্মে অঙ্গীকার করছি যে, মরহুম সাজ্জাদ হোসাইন স্মৃতি ফুটবল একাডেমির সকল নিয়ম মেনে চলবো।
</textarea>

<div class="signature">
<div>_________<br>সদস্য</div>
<div>_________<br>অভিভাবক</div>
<div>_________<br>ম্যানেজমেন্ট</div>
</div>

</div>

<button onclick="downloadPDF()">📄 PDF Download</button>

<script>
function loadPhoto(event) {
    document.getElementById('photo').src = URL.createObjectURL(event.target.files[0]);
}

function downloadPDF() {
    const element = document.getElementById("formArea");
    html2pdf().from(element).save("MSH_Registration.pdf");
}
</script>

</body>
</html>
