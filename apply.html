<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>MSH Football Academy Registration</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    margin: 0;
    padding: 20px;
}

.form-container {
    background: #fff;
    max-width: 800px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.header {
    text-align: center;
    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
}

.header img {
    width: 80px;
}

.header h2 {
    margin: 10px 0;
    color: #0f2027;
}

.photo-box {
    width: 120px;
    height: 140px;
    border: 2px dashed #aaa;
    margin: 15px auto;
    text-align: center;
    line-height: 140px;
    color: #888;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 5px;
}

textarea {
    resize: none;
}

.signature {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.signature div {
    text-align: center;
    width: 30%;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #0f2027;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #203a43;
}
</style>
</head>

<body>

<div id="formArea" class="form-container">

<div class="header">
    <img src="logo.png">
    <h2>মরহুম সাজ্জাদ হোসাইন স্মৃতি ফুটবল একাডেমি</h2>
    <label>তারিখ:</label>
    <input type="date">
</div>

<div class="photo-box">ছবি</div>

<div class="form-group">
<label>নাম</label>
<input type="text">
</div>

<div class="form-group">
<label>জন্ম তারিখ</label>
<input type="date">
</div>

<div class="form-group">
<label>গ্রাম</label>
<input type="text">
</div>

<div class="form-group">
<label>শিক্ষাগত যোগ্যতা</label>
<input type="text">
</div>

<div class="form-group">
<label>থানা ও জেলা</label>
<input type="text">
</div>

<div class="form-group">
<label>পরিচয়পত্র নং</label>
<input type="text">
</div>

<div class="form-group">
<label>মোবাইল নাম্বার</label>
<input type="text">
</div>

<div class="form-group">
<label>ইমেইল</label>
<input type="email">
</div>

<div class="form-group">
<label>রক্তের গ্রুপ</label>
<input type="text">
</div>

<h3>অঙ্গীকারনামা</h3>

<textarea rows="10">
আমি এই মর্মে অঙ্গীকার করছি যে, মরহুম সাজ্জাদ হোসাইন স্মৃতি ফুটবল একাডেমির নিয়ম-শৃঙ্খলা, সম্মান, সততা ও দায়িত্বশীলতা সর্বদা মেনে চলবো।

১. একাডেমির সকল নিয়ম-কানুন যথাযথভাবে পালন করব  
২. কোচ, খেলোয়াড় ও স্টাফদের সম্মান করব  
৩. অনুশীলনে নিয়মিত উপস্থিত থাকব  
৪. শৃঙ্খলা ও আচরণে একাডেমির মর্যাদা রক্ষা করব  
৫. ব্যক্তিগত ফিটনেস উন্নত রাখব  
৬. মাঠে ও মাঠের বাইরে ভদ্র আচরণ বজায় রাখব  
৭. একাডেমির সুনাম ক্ষুণ্ন করব না  
৮. নেশাজাতীয় অভ্যাস থেকে দূরে থাকব  
৯. দল ও একাডেমির প্রতি নিবেদিত থাকব  
১০. নিজেকে একজন ভালো খেলোয়াড় হিসেবে গড়ে তুলব  
</textarea>

<div class="signature">
    <div>_____________<br>সদস্য সাক্ষর</div>
    <div>_____________<br>অভিভাবক</div>
    <div>_____________<br>ম্যানেজমেন্ট</div>
</div>

</div>

<button onclick="downloadPDF()">📄 PDF Download</button>

<script>
function downloadPDF() {
    const element = document.getElementById("formArea");
    html2pdf().from(element).save("Registration_Form.pdf");
}
</script>

</body>
</html>
